# ===== GVP Book Store API - plain CRUD, no database =====

spring.application.name=gvp-spring-boot-unit4
spring.profiles.active=prod

# Different port from gvp-spring-boot-unit2 so both demo apps can run side by side
server.port=8081

# ----- Logging -----
logging.level.root=INFO
logging.level.com.gvp.unit4=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# ----- Swagger / OpenAPI (springdoc) -----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# HS256 secret, base64-encoded, >= 256 bits. Generated with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:YOUR_JWT_SECRET_HERE}
app.jwt.expiration-ms=3600000

app.security.seed.admin-username=admin
app.security.seed.admin-password=Admin@123
app.security.seed.user-username=user
app.security.seed.user-password=User@123

# ----- Google OAuth2 Credentials -----
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID_HERE}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET_HERE}
spring.security.oauth2.client.registration.google.scope=openid,profile,email